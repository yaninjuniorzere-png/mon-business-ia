
name: Construire APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dézipper le projet
        run: |
          ls -la
          unzip -o mon_business_ia_pour_compilation_depuis_telephone.zip
          echo "--- après dézip ---"
          ls -la
          # Trouver où est le pubspec.yaml
          PROJET=$(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1 | xargs dirname)
          echo "PROJET=$PROJET" >> $GITHUB_ENV
          echo "Projet trouvé dans : $PROJET"
          ls -la "$PROJET"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Construire l'APK
        run: |
          cd "$PROJET"
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mon-business-ia-apk
          path: ${{ env.PROJET }}/build/app/outputs/flutter-apk/app-release.apk
